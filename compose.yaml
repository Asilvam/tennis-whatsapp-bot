name: tennis-whatsapp-bot

services:
  bot:
    build: .
    image: tennis-whatsapp-bot:local
    init: true
    restart: "no"
    stop_grace_period: 12s
    shm_size: "1gb"
    env_file:
      - path: .env
        format: raw
    environment:
      # localhost dentro del contenedor no es el Mac.
      API_BASE_URL: ${DOCKER_API_BASE_URL:-http://host.docker.internal:3500}
      CHROME_PATH: /usr/bin/chromium
      WHATSAPP_HEADLESS: "true"
      CHROME_NO_SANDBOX: "true"
      # No heredar DRY_RUN=false del bot nativo durante las pruebas Docker.
      DRY_RUN: ${DOCKER_DRY_RUN:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - bot_state:/app/state
      - bot_auth:/app/.wwebjs_auth
      - bot_cache:/app/.wwebjs_cache
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_state:
  bot_auth:
  bot_cache:
