name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      # Las pruebas usan almacenamiento simulado; no requieren credenciales ni Chrome.
      - run: npm test
      - run: npm run check
